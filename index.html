<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kiwi Bitcoin — A Free Bitcoin Resource for Kiwis</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#fff;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      font-family:'Georgia',serif;
      overflow:hidden;
    }
    .scene {
      position:relative;
      width:380px;
      height:260px;
    }
    .kiwi {
      position:absolute;
      bottom:0;
      left:50%;
      transform:translateX(-50%);
      width:380px;
    }
    .coin {
      position:absolute;
      top:-10px;
      left:238px;
      width:48px;
      height:48px;
      animation:drop 2.2s ease-in infinite;
      z-index:10;
    }
    @keyframes drop {
      0%   { top:-10px; opacity:1; transform:rotateY(0deg); }
      54%  { top:38px;  opacity:1; transform:rotateY(540deg); }
      62%  { top:38px;  opacity:0; }
      100% { top:-10px; opacity:0; }
    }
    .flash {
      position:absolute;
      top:40px;
      left:236px;
      width:30px;
      height:6px;
      background:#F7931A;
      border-radius:3px;
      opacity:0;
      animation:flash 2.2s ease-in infinite;
      z-index:20;
    }
    @keyframes flash {
      0%,57% { opacity:0; }
      62%    { opacity:1; }
      70%    { opacity:0; }
      100%   { opacity:0; }
    }
    .logo {
      font-size:2.2rem;
      font-weight:700;
      color:#111;
      letter-spacing:-0.02em;
      margin-top:1rem;
    }
    .logo span { color:#F7931A; }
  </style>
</head>
<body>
  <div class="scene">
    <img class="kiwi" src="kiwi_shape.png" alt="Kiwi Bitcoin"/>
    <div class="coin">
      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="23" fill="#F7931A" stroke="#d97e10" stroke-width="1.5"/>
        <text x="24" y="31" text-anchor="middle" font-size="22" font-weight="bold" fill="white" font-family="Arial">₿</text>
      </svg>
    </div>
    <div class="flash"></div>
  </div>
  <div class="logo">Kiwi<span>Bitcoin</span></div>
</body>
</html>
